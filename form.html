<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"> <!--bootstrapin icon kütüphanesi cdn i yukarıdaki css için-->

</head>

<body>

   <div class="kayan-yazı ">
  <p>
    <span class="bosluk">%50 İndirim Fırsatı!  <i class="bi bi-balloon-heart"></i>  </i>Hemen Kayıt Ol !</span>
      
  </p>
</div>
      




<div class="d-flex justify-content-center align-items-center vh-100">

<div class="form-container w-50  ">

    <form class="container mt-5 p-5 " id="contactForm">

        <div class="mb-4">
            <label class="form-label">Ad</label>
            <input type="text" class="form-control" placeholder="Adınızı girin"required >
        </div>

        <div class="mb-4">
            <label class="form-label">Soyad</label>
            <input type="text" class="form-control" placeholder="Soyadınızı girin"required >
        </div>

        <div class="mb-4">
            <label class="form-label">Telefon</label>
            <input type="tel" class="form-control" placeholder="05xx xxx xx xx" required>
        </div>

        <div class="mb-5">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="ornek@mail.com"required >
        </div>

        <select class="form-select"  required>
            <option value="" selected disabled>
        İl seçiniz
    </option>
            <option value="1">İstanbul</option>
            <option value="2">Ankara</option>
            <option value="3">İzmir</option>
            <option value="3">Isparta</option>
            <option value="3">Antalya</option>

        </select>

        <div id="successMessage" class="alert alert-success d-none mt-3">
  Formunuz gönderildi. Sizinle en yakın zamanda iletişime geçeceğiz :)
</div>

        <button type="submit" class="btn btn-danger my-4 " id="submit-button">Gönder</button>

    </form>
</div>


</div>


<script src="script.js"></script>
</body>

</html>
